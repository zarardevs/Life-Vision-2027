<!DOCTYPE html>
<html lang="en" data-theme="sky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Vision 2027 ✦ Your Enchanted Life Planner</title>
<script>try{var s=JSON.parse(localStorage.getItem('lifeVision2027_v1'))||{},m=s.mode||'auto',h=new Date().getHours();if(m==='dark'||(m==='auto'&&(h>=19||h<6)))document.documentElement.classList.add('dark');if(s.theme)document.documentElement.dataset.theme=s.theme}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600;1,700&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ================= THEME ================= */
:root{
  --p:#38bdf8; --pd:#0369a1; --a1:#a78bfa; --a2:#f9a8d4;
  --grad:linear-gradient(135deg,var(--p),var(--a1));
  --grad3:linear-gradient(90deg,var(--p),var(--a1),var(--a2));
  --sky1:color-mix(in srgb,var(--p) 38%,white);
  --sky2:color-mix(in srgb,var(--a1) 16%,white);
  --sky3:color-mix(in srgb,var(--a2) 26%,white);
  --text:#1c2748; --muted:#66749b; --head:var(--pd);
  --glass:rgba(255,255,255,.46); --glass2:rgba(255,255,255,.16);
  --sheen:rgba(255,255,255,.55);
  --field:rgba(255,255,255,.6);
  --line:color-mix(in srgb,var(--p) 20%,transparent);
  --glow:color-mix(in srgb,var(--p) 55%,transparent);
  --glow2:color-mix(in srgb,var(--a1) 45%,transparent);
  --shadow:0 12px 40px -14px color-mix(in srgb,var(--pd) 40%,transparent);
  /* hero scene */
  --hs1:color-mix(in srgb,var(--p) 48%,white); --hs2:color-mix(in srgb,var(--a1) 22%,white); --hs3:color-mix(in srgb,var(--a2) 38%,white);
  --orb:#fff6cc; --orbc:#fffbea;
  --hl1:color-mix(in srgb,var(--a1) 38%,white); --hl1b:color-mix(in srgb,var(--a1) 20%,white);
  --hl2:color-mix(in srgb,var(--p) 42%,white); --hl2b:color-mix(in srgb,var(--p) 20%,white);
  --hl3:color-mix(in srgb,var(--p) 18%,white); --hl3b:#ffffff;
  --castle:color-mix(in srgb,var(--a1) 52%,white); --castled:color-mix(in srgb,var(--a1) 70%,#2e1065);
  --cloud:rgba(255,255,255,.9);
  --r:22px;
}
html[data-theme="ocean"]{--p:#3b82f6;--pd:#1e40af;--a1:#22d3ee;--a2:#a5b4fc}
html[data-theme="lavender"]{--p:#a78bfa;--pd:#5b21b6;--a1:#f0abfc;--a2:#93c5fd}
html[data-theme="sunset"]{--p:#fb923c;--pd:#c2410c;--a1:#f472b6;--a2:#fde047}
html[data-theme="emerald"]{--p:#34d399;--pd:#047857;--a1:#67e8f9;--a2:#fde68a}
html[data-theme="rose"]{--p:#fb7185;--pd:#be123c;--a1:#c084fc;--a2:#fdba74}
html.dark{
  --sky1:#070b2a; --sky2:#1a1650; --sky3:color-mix(in srgb,var(--a1) 28%,#1e1b4b);
  --text:#eef1ff; --muted:#a9b3dc; --head:#fff;
  --glass:rgba(60,66,140,.34); --glass2:rgba(20,22,70,.22); --sheen:rgba(255,255,255,.09);
  --field:rgba(12,16,52,.5);
  --line:rgba(190,200,255,.14);
  --glow:color-mix(in srgb,var(--p) 60%,transparent);
  --shadow:0 14px 40px -14px rgba(0,0,0,.75);
  --hs1:#070b2a; --hs2:#251f6b; --hs3:color-mix(in srgb,var(--a1) 40%,#2e1065);
  --orb:#fff4c2; --orbc:#fffbeb;
  --hl1:#2c2878; --hl1b:#211d5c; --hl2:color-mix(in srgb,var(--p) 30%,#1e1b4b); --hl2b:#17143f;
  --hl3:color-mix(in srgb,var(--a1) 26%,#151339); --hl3b:#0e0c2c;
  --castle:#1b1850; --castled:#0a0a26; --cloud:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--sky2)}
body{font-family:Quicksand,system-ui,sans-serif;font-weight:500;color:var(--text);min-height:100vh;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));background-attachment:fixed;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--a2);color:#1c2748}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
/* mascot */
.mascot{display:flex;justify-content:center;margin:-8px 0 2px}
.mascot svg{width:170px;height:auto;overflow:visible;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 12px 18px var(--glow2))}
.m-arm{transform-origin:118px 86px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
.m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.m-bub{transform-box:fill-box;transform-origin:right bottom;animation:spLetter .7s .2s cubic-bezier(.2,1.5,.4,1) both}
.m-lines{animation:tw 1.1s ease-in-out infinite}
/* scroll magic */
.sprog{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:var(--grad3);box-shadow:0 0 12px var(--glow),0 0 4px #fff;border-radius:0 4px 4px 0;pointer-events:none}
.sprog::after{content:"✦";position:absolute;right:-7px;top:-8px;font-size:13px;color:#fff;text-shadow:0 0 8px var(--p),0 0 14px var(--a1)}
.totop{position:fixed;right:22px;bottom:22px;width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.6);color:#fff;cursor:pointer;z-index:60;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,transparent 30%),var(--grad);box-shadow:0 0 22px var(--glow);opacity:0;transform:translateY(24px) scale(.7);pointer-events:none;transition:.45s cubic-bezier(.2,1.4,.4,1)}
.totop.show{opacity:1;transform:none;pointer-events:auto;animation:bob 3s ease-in-out infinite}
.totop:hover{box-shadow:0 0 34px var(--glow),0 0 50px var(--glow2)}
.totop svg{width:20px;height:20px;transform:rotate(90deg)}
.rv{opacity:0;transform:translateY(30px) scale(.97);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)!important}
.rv.in{opacity:1;transform:none}
.side-fade{position:sticky;bottom:-18px;height:34px;margin:0 -12px -18px;pointer-events:none;background:linear-gradient(transparent,color-mix(in srgb,var(--sky2) 70%,transparent));border-radius:0 0 26px 26px;transition:opacity .3s}
.side.at-end .side-fade{opacity:0}
/* ===== Splash: Made by Zarar A. Devs (sticker style) ===== */
#splash{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#fff7fb,var(--sky1) 40%,var(--sky2) 75%,var(--sky3));transition:opacity .9s ease,visibility .9s,transform .9s ease}
#splash::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.75) 1.6px,transparent 2px);background-size:26px 26px;opacity:.55;pointer-events:none}
#splash.hide{opacity:0;visibility:hidden;transform:scale(1.06)}
#splash.hide .sp-hero{animation:spYay .7s cubic-bezier(.3,1.6,.5,1) both}
#splash .aurora{opacity:.55}
.sp-in{position:relative;text-align:center;padding:20px;z-index:2}
.stk{position:absolute;width:var(--w);transform:rotate(var(--r));animation:stkSlap .65s var(--d) cubic-bezier(.3,1.6,.5,1) both;z-index:1}
.stk svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 7px 9px rgba(70,40,100,.2));animation:stkFloat var(--f,3.4s) ease-in-out infinite}
.stk-eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.sp-hero{position:relative;width:170px;margin:0 auto -4px;animation:spDrop 1.1s .15s cubic-bezier(.3,1.4,.5,1) both}
.sp-hero svg{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 14px rgba(70,40,100,.22));transform-origin:50% 95%;animation:spHop 1.4s 1.3s ease-in-out infinite}
.bun-earL{transform-box:fill-box;transform-origin:50% 100%;animation:earL 2.2s 1.3s ease-in-out infinite}
.bun-earR{transform-box:fill-box;transform-origin:50% 100%;animation:earR 2.2s 1.5s ease-in-out infinite}
.bun-eye{animation-delay:1.8s}
.sp-title{font-family:'Dancing Script',cursive;font-size:46px;font-weight:700;line-height:1.1;margin-top:8px;
  background:linear-gradient(90deg,#ff6fae,#a78bfa,#5fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:spUp .9s .6s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 2px 0 #fff)}
.sp-tag{display:inline-block;margin-top:18px;padding:8px 26px 10px;border-radius:26px;background:#fff;transform:rotate(-3deg);
  box-shadow:0 10px 22px rgba(70,40,100,.16),0 0 0 3px #ffe1ef inset;animation:tagSlap .7s 1s cubic-bezier(.3,1.6,.5,1) both}
.sp-by{font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:#b27ca0;font-weight:800}
.sp-name{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:54px;line-height:1.1;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.sp-name span{display:inline-block;background:linear-gradient(90deg,#ff6fae,#a78bfa,#5fb4ff,#ff6fae);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:spLetter .8s var(--d) cubic-bezier(.2,1.5,.4,1) both,spShimmer 4s linear infinite}
.sp-name svg{width:34px;height:34px;margin-left:8px;overflow:visible;filter:drop-shadow(0 3px 4px rgba(255,90,160,.35));animation:spLetter .8s 2.3s both,spBeat 1.2s 3.1s ease-in-out infinite}
.sp-bar{position:relative;width:230px;height:12px;margin:30px auto 0;border-radius:99px;background:#fff;box-shadow:0 4px 10px rgba(70,40,100,.12),inset 0 0 0 2px #ffe1ef;animation:spFade .6s 1s both}
.sp-bar i{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:99px;background:repeating-linear-gradient(-45deg,#ff9ec7 0 8px,#ffb8d6 8px 16px);animation:spLoad 2.8s 1.1s ease-in-out forwards}
.sp-bar b{position:absolute;top:50%;left:0;width:34px;transform:translate(-50%,-55%);animation:spRide 2.8s 1.1s ease-in-out forwards,spFade .6s 1s both}
.sp-bar b svg{display:block;width:100%;animation:spSpin 1.6s linear infinite;filter:drop-shadow(0 3px 4px rgba(70,40,100,.25))}
.sp-load{margin-top:14px;font-size:12px;color:#b27ca0;font-weight:800;letter-spacing:.14em;animation:spFade .8s 1.2s both}
.sp-load span{display:inline-block;animation:spDot 1s ease-in-out infinite}.sp-load span:nth-child(2){animation-delay:.15s}.sp-load span:nth-child(3){animation-delay:.3s}
.sp-f{position:absolute;bottom:-50px;font-size:var(--s);opacity:0;animation:spRise var(--t) var(--dl) linear infinite;pointer-events:none}
@keyframes stkSlap{0%{opacity:0;transform:scale(1.9) rotate(calc(var(--r) - 30deg))}55%{opacity:1;transform:scale(.88) rotate(calc(var(--r) + 4deg))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
@keyframes stkFloat{50%{transform:translateY(-9px) rotate(4deg)}}
@keyframes tagSlap{0%{opacity:0;transform:scale(1.7) rotate(-18deg)}60%{opacity:1;transform:scale(.94) rotate(-1deg)}100%{opacity:1;transform:rotate(-3deg)}}
@keyframes earL{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg)}80%{transform:rotate(6deg)}}
@keyframes earR{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(14deg)}80%{transform:rotate(-6deg)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spFade{from{opacity:0}}
@keyframes spDrop{0%{opacity:0;transform:translateY(-160px) scale(.6)}55%{opacity:1;transform:translateY(0) scale(1.18,.82)}75%{transform:translateY(-14px) scale(.94,1.06)}100%{transform:none}}
@keyframes spHop{0%,80%,100%{transform:none}10%{transform:scale(1.07,.93)}45%{transform:translateY(-16px) scale(.96,1.04) rotate(-4deg)}70%{transform:scale(1.05,.95)}}
@keyframes spYay{50%{transform:translateY(-40px) scale(1.2) rotate(8deg)}100%{transform:translateY(-12px) scale(1.1)}}
@keyframes spUp{from{opacity:0;transform:translateY(18px)}}
@keyframes spLetter{0%{opacity:0;transform:translateY(40px) scale(.3) rotate(-15deg)}100%{opacity:1;transform:none}}
@keyframes spShimmer{to{background-position:400% 0}}
@keyframes spBeat{0%,100%{transform:scale(1)}25%{transform:scale(1.25)}45%{transform:scale(.95)}}
@keyframes spLoad{to{width:calc(100% - 6px)}}
@keyframes spRide{to{left:100%}}
@keyframes spDot{50%{transform:translateY(-4px);opacity:.4}}
@keyframes spRise{8%,85%{opacity:.8}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
html.dark #splash{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--sky1) 80%,#a78bfa),var(--sky2) 55%,var(--sky3))}
html.dark #splash::before{opacity:.25}
html.dark .sp-title{background:linear-gradient(90deg,#ffc2dc,#d9c8ff,#bfe3ff);-webkit-background-clip:text;background-clip:text;filter:none}
html.dark .sp-load{color:#e9d5ff}
@media (max-width:520px){.s3{left:3%!important;top:72%!important}.s4{top:66%!important}.s7{top:26%!important}.sp-name{font-size:34px}.sp-name svg{width:24px;height:24px}.sp-title{font-size:36px}.sp-hero{width:140px}.stk{width:calc(var(--w) * .62)}.sp-tag{padding:6px 18px 8px}}
/* ================= PRO FEATURES ================= */
.xpcard{margin:0 4px 8px;padding:12px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 18%,transparent),color-mix(in srgb,var(--a1) 18%,transparent));border:1px solid var(--line);transition:.3s}
.xpcard:hover{box-shadow:0 0 18px -4px var(--glow);transform:translateY(-2px)}
.xpl{display:flex;align-items:center;gap:10px}
.lv{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 10%,transparent 32%),var(--grad);box-shadow:0 0 14px var(--glow);flex-shrink:0}
.xpl b{font-size:13px;display:block}.xpl small{font-size:11px;color:var(--muted);font-weight:600}
.xpl .tro{margin-left:auto;font-size:18px;filter:drop-shadow(0 0 8px #fde68a)}
.xpcard .bar{margin-top:9px;height:6px}
.xpf{position:fixed;z-index:1001;pointer-events:none;font-weight:700;font-size:14px;color:#fff;background:var(--grad);padding:3px 11px;border-radius:20px;box-shadow:0 0 14px var(--glow);transform:translate(-50%,-50%);animation:xpUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-280%) scale(.9)}}
.t.edit,.gcard h4.edit{cursor:pointer;transition:color .2s}.t.edit:hover{color:var(--p)}
.t.edit:hover::after{content:" ✎";opacity:.7}
.nb{font-style:normal;font-size:12px;margin-left:4px}
.tchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--a1) 18%,transparent);white-space:nowrap}
.del.ed:hover{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.undo{margin-left:10px;border:0;background:rgba(255,255,255,.3);color:#fff;font-weight:700;padding:4px 12px;border-radius:10px;cursor:pointer}
.undo:hover{background:rgba(255,255,255,.5)}
.mplay{color:var(--p)!important;box-shadow:0 0 16px -2px var(--glow)!important;animation:spGlow2 2s ease-in-out infinite}
/* modal + palette */
.modal,.pal{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;padding:16px;background:rgba(10,14,45,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.3s}
.modal.show,.pal.show{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s}
.mbox,.pbox{background:linear-gradient(180deg,var(--sheen),transparent 40%),linear-gradient(145deg,color-mix(in srgb,var(--sky1) 88%,transparent),color-mix(in srgb,var(--sky3) 88%,transparent))!important}
.mbox{width:min(520px,100%);max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:22px;transform:translateY(24px) scale(.95);transition:.4s cubic-bezier(.2,1.3,.4,1)}
.modal.show .mbox,.pal.show .pbox{transform:none}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.mhead h3{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;background:linear-gradient(90deg,var(--pd),color-mix(in srgb,var(--a1) 75%,var(--pd)));-webkit-background-clip:text;background-clip:text;color:transparent}
html.dark .mhead h3{background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text}
.mbox.glass::after,.pbox.glass::after{inset:0}
.mfield{display:block;margin-bottom:12px}.mfield>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.mfield .inp{width:100%}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.pal{align-items:start;padding-top:12vh}
.pbox{width:min(620px,100%);padding:10px;transform:translateY(-16px) scale(.97);transition:.4s cubic-bezier(.2,1.3,.4,1)}
.pin{display:flex;align-items:center;gap:10px;padding:6px 10px 10px;border-bottom:1px dashed var(--line)}
.pin svg{width:20px;height:20px;color:var(--p);flex-shrink:0}
.pin input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;font-weight:600;padding:8px 0}
.kbd{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:var(--field);color:var(--muted);white-space:nowrap;font-family:inherit}
.plist{max-height:54vh;overflow:auto;padding:6px 0}
.pitem{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:13px;cursor:pointer;transition:background .15s}
.pitem b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitem small{font-size:12px;color:var(--muted);font-weight:600}
.pitem.on,.pitem:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--p) 20%,transparent),color-mix(in srgb,var(--a1) 12%,transparent));box-shadow:inset 3px 0 0 var(--p)}
.searchbtn{min-width:190px;justify-content:flex-start!important;color:var(--muted)}
.searchbtn .lbl{flex:1;text-align:left}
/* player */
.player{position:fixed;right:22px;bottom:22px;z-index:70}
.pfab{position:relative;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.6);cursor:pointer;color:#fff;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,transparent 30%),var(--grad);box-shadow:0 0 24px var(--glow),0 8px 20px -6px var(--glow2);transition:transform .3s}
.pfab:hover{transform:scale(1.08)}
.pfab svg{width:24px;height:24px;position:relative;z-index:1}
.pfab .vinyl{position:absolute;inset:5px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.2) 0 1px,transparent 1px 4px);opacity:0;transition:.3s}
.player.playing .pfab .vinyl{opacity:1;animation:spSpin 3s linear infinite}
.player.playing .pfab{animation:spGlow2 2s ease-in-out infinite}
@keyframes spGlow2{50%{box-shadow:0 0 40px var(--glow),0 0 64px var(--glow2)}}
.ppanel{position:absolute!important;right:0;bottom:72px;width:320px;padding:16px;border-radius:24px;opacity:0;visibility:hidden;transform:translateY(16px) scale(.94);transform-origin:bottom right;transition:.4s cubic-bezier(.2,1.3,.4,1);
  background:linear-gradient(180deg,var(--sheen),transparent 40%),linear-gradient(145deg,color-mix(in srgb,var(--sky1) 82%,transparent),color-mix(in srgb,var(--sky3) 82%,transparent))!important}
.player.open .ppanel{opacity:1;visibility:visible;transform:none}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.phead b{font-family:'Dancing Script',cursive;font-size:26px;display:block;line-height:1.1}
.phead small{font-size:11.5px;color:var(--muted);font-weight:700}
#viz{width:100%;height:64px;display:block;border-radius:14px;background:color-mix(in srgb,var(--p) 9%,transparent)}
.pctl{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.pplay{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,transparent 30%),var(--grad);box-shadow:0 0 20px var(--glow);transition:.25s}
.pplay:hover{transform:scale(1.08)}
.pplay svg{width:22px;height:22px}
.pmoods{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.pmoods .pill{font-size:12px;padding:7px 6px;text-align:center}
.prow{display:flex;align-items:center;gap:10px}.prow svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.prow input[type=range]{margin:0}
.prow2{display:flex;gap:6px;margin-top:12px}.prow2 .pill{flex:1;text-align:center;font-size:12px}
.totop{bottom:94px!important}
/* countdowns & affirmation */
.cdrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px dashed var(--line);border-radius:10px}
.cdrow:last-child{border:0}.cdrow:hover .del{opacity:1}
.cde{font-size:28px;filter:drop-shadow(0 0 8px var(--glow2))}
.cdn{text-align:center;min-width:56px}.cdn b{display:block;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.cdn small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.cdlive{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.affq{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;line-height:1.45;text-align:center;padding:8px 6px;
  background:linear-gradient(90deg,var(--pd),color-mix(in srgb,var(--a1) 80%,var(--pd)));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fade .6s ease}
html.dark .affq{background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text}
/* month planner */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.mh{text-align:center;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:4px}
.mcell{min-height:104px;border-radius:14px;padding:7px;background:var(--field);border:1px solid var(--line);cursor:pointer;transition:.2s;overflow:hidden;min-width:0}
.mcell:hover{border-color:var(--p);box-shadow:0 0 12px -3px var(--glow)}
.mcell.om{opacity:.45}
.mcell.today{box-shadow:0 0 0 2px var(--p),0 0 18px -4px var(--glow)}
.mn{font-weight:700;font-size:13px;margin-bottom:4px}.mcell.today .mn{color:var(--p)}
.mtask{font-size:11px;font-weight:600;padding:3px 6px;border-radius:7px;margin-bottom:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--p) 24%,transparent),color-mix(in srgb,var(--a1) 16%,transparent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.mtask.done{text-decoration:line-through;opacity:.6}
.more{font-size:10px;color:var(--muted);font-weight:700}
.dragging{opacity:.35}
.drop-on{box-shadow:0 0 0 2px var(--a1),0 0 24px -2px var(--glow2)!important;transform:scale(1.02)}
.ditem[draggable=true]{cursor:grab}
/* milestones */
.ms{margin-top:12px}
.msr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;font-weight:600}
.msr.done span{text-decoration:line-through;color:var(--muted)}
.msr .chk{width:18px;height:18px;border-radius:6px}.msr .chk svg{width:11px;height:11px}
.bill-due{font-size:11.5px;font-weight:700;white-space:nowrap}
/* heatmaps */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:4px}
.hx{display:block;aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--p) 10%,transparent);transition:transform .2s}
.hx:hover{transform:scale(1.5);position:relative;z-index:2}
.hx.fut{background:transparent}
.hlegend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:12px}
.hlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
/* rewards */
.lvhero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.lvorb{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;color:#fff;text-align:center;flex-shrink:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 10%,transparent 32%),var(--grad);box-shadow:0 0 40px var(--glow),0 0 70px var(--glow2);animation:spGlow 3s ease-in-out infinite}
.lvorb b{font-size:44px;display:block;line-height:1}.lvorb small{font-size:11px;letter-spacing:.18em;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{text-align:center;padding:16px 10px;border-radius:20px;border:1px solid var(--line);background:var(--field);transition:.3s}
.badge .be{font-size:38px;display:block;margin-bottom:6px}
.badge b{font-size:13px;display:block}.badge small{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:3px}
.badge.on{border-color:color-mix(in srgb,var(--a1) 50%,transparent);box-shadow:0 0 22px -6px var(--glow2);background:linear-gradient(160deg,color-mix(in srgb,var(--p) 14%,transparent),color-mix(in srgb,var(--a2) 14%,transparent))}
.badge.on .be{filter:drop-shadow(0 0 10px var(--glow2));animation:bob 3s ease-in-out infinite}
.badge.off{opacity:.55}.badge.off .be{filter:grayscale(1);opacity:.6}
.badge:hover{transform:translateY(-4px)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;font-size:13px;font-weight:600}
@media (max-width:900px){.searchbtn{min-width:0}.searchbtn .lbl,.searchbtn .kbd{display:none}.mcell{min-height:72px;padding:5px}.mtask{font-size:9.5px;padding:2px 4px}.player{right:12px;bottom:12px}}
@media (max-width:520px){.ppanel{width:calc(100vw - 30px)}.mgrid{gap:4px}}

/* ================= MAGIC BACKGROUND ================= */
.magic{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 22s ease-in-out infinite alternate}
.aurora.a{width:520px;height:520px;background:var(--p);top:-160px;left:-120px}
.aurora.b{width:460px;height:460px;background:var(--a1);top:20%;right:-140px;animation-duration:28s}
.aurora.c{width:420px;height:420px;background:var(--a2);bottom:-160px;left:35%;animation-duration:32s}
html.dark .aurora{opacity:.32}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,70px) scale(.95)}}
.star{position:absolute;color:#fff;animation:tw 3.6s ease-in-out infinite;text-shadow:0 0 10px #fff,0 0 18px var(--p)}
.dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 4s ease-in-out infinite}
html:not(.dark) .dot{opacity:.0}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.15);opacity:1}}
.firefly{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--a2) 45%,transparent 70%);box-shadow:0 0 12px 3px var(--glow2);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(40px,-50vh)}90%{opacity:.9}100%{transform:translate(-30px,-105vh);opacity:0}}
.clouds{position:absolute;left:0;right:0;bottom:-10px;width:100%;height:180px;opacity:.75}
html.dark .clouds{opacity:.18}
.shoot{position:absolute;width:140px;height:2px;background:linear-gradient(90deg,#fff,transparent);border-radius:2px;top:12%;left:70%;transform:rotate(-25deg);opacity:0;animation:shoot 9s ease-in infinite;filter:drop-shadow(0 0 6px #fff)}
.shoot.s2{top:30%;left:40%;animation-delay:4.5s}
html:not(.dark) .shoot{display:none}
@keyframes shoot{0%,88%{opacity:0;transform:rotate(-25deg) translateX(0)}90%{opacity:1}100%{opacity:0;transform:rotate(-25deg) translateX(-420px)}}

/* fairy dust + bursts */
.dust{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:999;background:radial-gradient(circle,#fff 0%,var(--c,var(--p)) 55%,transparent 72%);box-shadow:0 0 10px 2px var(--c,var(--glow));animation:dust 1s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),30px) scale(0);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:999;font-size:14px;color:var(--c);text-shadow:0 0 8px var(--c),0 0 14px #fff;animation:burst .8s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(180deg);opacity:0}}

/* ================= GLASS ================= */
.glass{position:relative;border-radius:var(--r);
  background:linear-gradient(180deg,var(--sheen),transparent 42%),linear-gradient(145deg,var(--glass),var(--glass2));
  backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid transparent;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12)}
html.dark .glass{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12)}
.glass::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.95),color-mix(in srgb,var(--a1) 45%,transparent) 35%,rgba(255,255,255,.25) 60%,color-mix(in srgb,var(--p) 55%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
html.dark .glass::after{background:linear-gradient(135deg,rgba(255,255,255,.35),color-mix(in srgb,var(--a1) 40%,transparent) 40%,transparent 65%,color-mix(in srgb,var(--p) 45%,transparent))}

/* ================= LAYOUT ================= */
.app{position:relative;z-index:1;display:flex;min-height:100vh;padding:18px;gap:18px}
.side{width:250px;flex-shrink:0;padding:18px 12px;position:sticky;top:18px;height:calc(100vh - 36px);overflow-y:auto;overflow-x:hidden;border-radius:26px;overscroll-behavior:contain;border:1px solid rgba(255,255,255,.7)!important}
.side.glass::after{display:none}
html.dark .side{border-color:rgba(200,210,255,.18)!important}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 50%),var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 0 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.7);animation:pulse 3s ease-in-out infinite}
.logo svg{width:22px;height:22px}
@keyframes pulse{0%,100%{box-shadow:0 0 16px var(--glow),inset 0 1px 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 30px var(--glow),0 0 50px var(--glow2),inset 0 1px 0 rgba(255,255,255,.7)}}
.brand b{white-space:nowrap;font-family:'Dancing Script',cursive;font-size:25px;line-height:1;background:linear-gradient(90deg,var(--pd),color-mix(in srgb,var(--a1) 70%,var(--pd)));-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
html.dark .brand b{background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px;font-weight:700}
.grp{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:14px 10px 5px;display:flex;align-items:center;gap:6px}
.grp::before{content:"✦";color:var(--a1);font-size:9px}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 9px;border-radius:13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);transition:.25s;text-align:left;overflow:hidden}
.nav:hover{background:color-mix(in srgb,var(--p) 12%,transparent);transform:translateX(3px)}
.nav.on{background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%),var(--grad);color:#fff;box-shadow:0 8px 22px -8px var(--glow),0 0 18px -4px var(--glow2),inset 0 1px 0 rgba(255,255,255,.6)}
.nav.on::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%{left:-50%}60%,100%{left:120%}}
.nav.on .ico{background:rgba(255,255,255,.28)!important;color:#fff!important;box-shadow:none!important}

/* tints */
.t1{--c:#38bdf8}.t2{--c:#f472b6}.t3{--c:#f59e0b}.t4{--c:#a78bfa}.t5{--c:#34d399}.t6{--c:#fb7185}.t7{--c:#2dd4bf}.t8{--c:#818cf8}.t9{--c:#fb923c}
.ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(180deg,rgba(255,255,255,.7),transparent 60%),color-mix(in srgb,var(--c) 26%,white);
  color:color-mix(in srgb,var(--c) 78%,#1e1b4b);box-shadow:0 4px 12px -4px var(--c),inset 0 1px 0 #fff}
html.dark .ico{background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 60%),color-mix(in srgb,var(--c) 26%,transparent);color:color-mix(in srgb,var(--c) 55%,white);box-shadow:0 0 14px -4px var(--c),inset 0 1px 0 rgba(255,255,255,.2)}
.ico svg{width:15px;height:15px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;padding:11px 14px;position:sticky;top:18px;z-index:5;border-radius:22px}
.top h1{font-size:18px;font-weight:700;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.top h1 .ico{width:34px;height:34px;border-radius:12px}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;transition:.3s;font-weight:600}
.saved.flash{color:var(--p);text-shadow:0 0 10px var(--glow)}
.chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;border-radius:13px;padding:9px 16px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:.25s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),var(--grad);color:#fff;box-shadow:0 8px 20px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transition:.6s}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px var(--glow),0 0 24px -6px var(--glow2),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.pri:hover::after{left:130%}
.btn.gh{background:var(--field);border:1px solid var(--line);backdrop-filter:blur(8px)}
.btn.gh:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}
.btn.sm{padding:6px 11px;font-size:12px}
.icon-btn{width:38px;height:38px;border-radius:13px;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;cursor:pointer;transition:.25s;flex-shrink:0}
.icon-btn:hover{color:var(--p);box-shadow:0 0 16px -2px var(--glow);transform:rotate(-8deg)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}
#view{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ================= CARDS ================= */
.card{padding:18px;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 0 30px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.75)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h3 a,.link{font-size:12px;font-weight:700;color:var(--p);cursor:pointer;text-decoration:none;transition:.2s}
.card h3 a:hover{text-shadow:0 0 10px var(--glow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.muted{color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.page-head{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h2{font-family:'Playfair Display',serif;font-style:italic;font-size:34px;font-weight:700;line-height:1.15;
  background:linear-gradient(90deg,var(--pd),color-mix(in srgb,var(--a1) 75%,var(--pd)));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px var(--glow2))}
html.dark .page-head h2{background:linear-gradient(90deg,#fff,var(--a2),var(--p));-webkit-background-clip:text;background-clip:text}
.page-head h2::after{content:" ✦";font-size:20px;-webkit-text-fill-color:var(--a1)}

/* ================= HERO ================= */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 32px 70px;min-height:230px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;box-shadow:var(--shadow),0 0 40px -14px var(--glow2)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.7);pointer-events:none}
html.dark .hero::after{border-color:rgba(255,255,255,.15)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .txt{position:relative;z-index:1}
.hero .hi{font-family:'Dancing Script',cursive;font-size:22px;color:var(--pd);opacity:.85}
html.dark .hero .hi{color:var(--a2)}
.hero h2{font-family:'Playfair Display',serif;font-style:italic;font-size:42px;font-weight:700;line-height:1.1;
  background:linear-gradient(90deg,var(--pd),color-mix(in srgb,var(--a1) 80%,var(--pd)));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,255,255,.8))}
html.dark .hero h2{background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px var(--glow2))}
.hero p{font-style:italic;color:var(--text);opacity:.8;margin-top:8px;font-size:15px;max-width:440px;font-weight:600}
.datecard{position:relative;z-index:1;padding:14px 18px;display:flex;gap:12px;align-items:center;max-width:290px;border-radius:18px}
.datecard .sun{font-size:28px;filter:drop-shadow(0 0 10px #fde68a)}
.datecard b{font-size:13.5px}.datecard small{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
.cloudy{animation:drift 55s linear infinite}
@keyframes drift{from{transform:translateX(-25%)}to{transform:translateX(110%)}}
.twk{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.win{animation:flick 4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.6}}

/* ================= STATS ================= */
.stat{display:flex;gap:13px;align-items:center}
.orb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 30%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 60%,#312e81));
  box-shadow:0 0 22px -2px var(--c),inset 0 -4px 10px rgba(0,0,0,.15)}
.orb svg{width:21px;height:21px}
.stat b{font-size:13px;display:block;color:var(--muted)}.stat .v{font-size:24px;font-weight:700;margin-top:1px}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:color-mix(in srgb,var(--p) 14%,transparent);overflow:hidden;margin-top:13px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{position:relative;display:block;height:100%;border-radius:9px;background:var(--grad3);transition:width .8s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 10px var(--glow);overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.bar.danger i{background:linear-gradient(90deg,#fb7185,#e11d48)}

/* ================= LISTS ================= */
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px dashed var(--line);border-radius:10px;transition:background .2s}
.row:hover{background:color-mix(in srgb,var(--p) 7%,transparent)}
.row:last-child{border-bottom:0}
.row .t{flex:1;font-size:14px;min-width:0;overflow-wrap:anywhere;font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.chk{width:22px;height:22px;border-radius:8px;border:2px solid color-mix(in srgb,var(--p) 45%,transparent);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.25s;background:var(--field)}
.chk:hover{border-color:var(--p);box-shadow:0 0 10px var(--glow)}
.chk.on{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%),var(--grad);border-color:transparent;box-shadow:0 0 12px var(--glow);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.chk svg{width:13px;height:13px;color:#fff;opacity:0;stroke-width:3}.chk.on svg{opacity:1}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,#1e1b4b);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
html.dark .tag{color:color-mix(in srgb,var(--c) 55%,white)}
.due-today{color:#d97706;font-weight:700;font-size:12px}.due-over{color:#e11d48;font-weight:700;font-size:12px}.due{color:var(--muted);font-size:12px;font-weight:600}
html.dark .due-today{color:#fcd34d}html.dark .due-over{color:#fda4af}
.del{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:8px;transition:.2s;flex-shrink:0;display:grid;place-items:center}
.row:hover .del,.vcard:hover .del,.note:hover .del,.gcard:hover .del,tr:hover .del,.jentry:hover .del{opacity:1}
.del:hover{color:#e11d48;background:rgba(251,113,133,.18)}
.del svg{width:15px;height:15px}
@media (hover:none){.del{opacity:.6}}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13.5px;font-weight:600}
.empty div{font-size:34px;margin-bottom:6px;filter:drop-shadow(0 0 10px var(--glow2))}

/* ================= FORMS ================= */
.addf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.inp{flex:1;min-width:140px;border:1px solid var(--line);background:var(--field);border-radius:13px;padding:10px 13px;font-size:13.5px;font-weight:600;outline:none;transition:.25s;backdrop-filter:blur(6px)}
.inp::placeholder{color:var(--muted);font-weight:500}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 16%,transparent),0 0 18px -4px var(--glow)}
select.inp{flex:0 0 auto;min-width:110px;cursor:pointer}
select.inp option{background:var(--sky2);color:var(--text)}
input[type=date].inp{flex:0 0 auto;min-width:145px}
html.dark input[type=date]{color-scheme:dark}
textarea.inp{min-height:110px;resize:vertical;width:100%;line-height:1.7}
.emoji-in{flex:0 0 66px!important;min-width:66px!important;text-align:center}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--field);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.25s}
.pill:hover{border-color:var(--p)}
.pill.on{background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%),var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 14px -2px var(--glow)}

/* quick links */
.ql{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qt{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:13px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;transition:.3s;text-align:center}
.qt:hover{transform:translateY(-4px);box-shadow:0 10px 24px -10px var(--c),0 0 18px -6px var(--c);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.qt .ico{width:38px;height:38px;border-radius:13px}.qt .ico svg{width:18px;height:18px}

/* habits */
.htable{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:640px}
.htable th{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:6px 4px;line-height:1.4}
.htable th.today{color:#fff;background:var(--grad);border-radius:12px;box-shadow:0 0 14px -2px var(--glow)}
.htable th:first-child{text-align:left}
.htable td{text-align:center;padding:4px 3px}
.htable td:first-child{text-align:left;font-weight:700;font-size:14px}
.htable tr:hover td{background:color-mix(in srgb,var(--p) 6%,transparent)}
.htable tr td:first-child{border-radius:12px 0 0 12px}.htable tr td:last-child{border-radius:0 12px 12px 0}
.hc{width:34px;height:34px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--p) 45%,transparent);cursor:pointer;display:inline-grid;place-items:center;transition:.25s;background:transparent}
.hc:hover{border-color:var(--p);transform:scale(1.1);box-shadow:0 0 12px var(--glow)}
.hc.on{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 10%,transparent 32%),var(--grad);border:2px solid transparent;color:#fff;box-shadow:0 0 14px var(--glow)}
.hc svg{width:14px;height:14px;stroke-width:3}
.streak{font-size:12px;font-weight:700;color:#ea580c;background:rgba(253,186,116,.3);padding:4px 10px;border-radius:20px;white-space:nowrap;border:1px solid rgba(251,146,60,.3)}
html.dark .streak{color:#fdba74}
.streak.zero{color:var(--muted);background:transparent;border-color:var(--line)}

/* goals */
.gcard .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gcard h4{font-size:16px;margin-top:10px}
.pct{font-size:26px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:color-mix(in srgb,var(--p) 16%,transparent);margin-top:16px;cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 15%,transparent 40%),var(--grad);box-shadow:0 0 14px var(--glow);border:2px solid #fff;cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--grad);box-shadow:0 0 14px var(--glow);border:2px solid #fff}

/* vision */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.vcard{position:relative;border-radius:24px;padding:22px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;transition:.4s;border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 34px -14px var(--vc),0 0 30px -12px var(--vc)}
.vcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 45%);pointer-events:none}
.vcard::after{content:"✦  ·  ✧    ·   ✦";position:absolute;top:18px;right:14px;font-size:12px;letter-spacing:2px;opacity:.85;animation:tw 3s infinite}
.vcard:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 20px 40px -14px var(--vc),0 0 40px -6px var(--vc)}
.vcard .em{font-size:48px;position:absolute;top:16px;left:16px;filter:drop-shadow(0 0 14px rgba(255,255,255,.8));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.vcard p{position:relative;font-family:'Playfair Display',serif;font-style:italic;font-size:20px;font-weight:600;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.vcard .del{position:absolute;bottom:12px;right:10px;color:#fff;background:rgba(0,0,0,.18);z-index:2}

/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{position:relative;width:220px;height:220px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px var(--glow))}
.ring .lbl{position:absolute;inset:18px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.5),transparent 60%)}
.ring .lbl b{font-size:44px;font-weight:700;letter-spacing:-.01em;display:block}
.ring .lbl small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.ring.run svg{animation:ringGlow 2s ease-in-out infinite}
@keyframes ringGlow{50%{filter:drop-shadow(0 0 20px var(--glow)) drop-shadow(0 0 30px var(--glow2))}}
.f3{display:flex;align-items:center;gap:12px;padding:9px 0}
.f3 .n{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;box-shadow:0 0 12px -2px var(--glow)}
.f3 input{border:0;border-bottom:2px solid var(--line);background:transparent;flex:1;padding:8px 2px;outline:none;font-size:14.5px;font-weight:600;min-width:0}
.f3 input:focus{border-color:var(--p)}
.f3.done input{text-decoration:line-through;color:var(--muted)}

/* planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{padding:12px;min-height:250px;display:flex;flex-direction:column;border-radius:20px}
.day.today{box-shadow:0 0 0 2px var(--p),0 0 26px -4px var(--glow),var(--shadow)}
.day h5{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.day .dn{font-size:24px;font-weight:700;margin-bottom:8px}
.day.today .dn{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ditem{font-size:12.5px;font-weight:600;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:7px 8px;margin-bottom:6px;display:flex;gap:7px;align-items:flex-start;cursor:pointer;overflow-wrap:anywhere;transition:.2s}
.ditem:hover{border-color:var(--p);box-shadow:0 0 10px -3px var(--glow)}
.ditem .chk{width:16px;height:16px;border-radius:5px}.ditem .chk svg{width:10px;height:10px}
.ditem.done span{text-decoration:line-through;color:var(--muted)}
.day form{margin-top:auto}
.day input{width:100%;border:1px dashed color-mix(in srgb,var(--p) 45%,transparent);border-radius:11px;padding:7px 9px;font-size:12px;background:transparent;outline:none;font-weight:600}
.day input:focus{border-style:solid;border-color:var(--p);box-shadow:0 0 10px -3px var(--glow)}

/* health */
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.glass-c{aspect-ratio:3/4;border-radius:6px 6px 14px 14px;border:2px solid color-mix(in srgb,var(--p) 40%,transparent);position:relative;overflow:hidden;cursor:pointer;transition:.25s;background:var(--field)}
.glass-c::before{content:"";position:absolute;top:4px;left:4px;width:4px;height:45%;border-radius:4px;background:rgba(255,255,255,.75);z-index:2}
.glass-c:hover{transform:translateY(-3px);box-shadow:0 0 12px var(--glow)}
.glass-c i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 50%,white),var(--p));transition:height .5s cubic-bezier(.2,.8,.3,1)}
.glass-c.on{border-color:var(--p);box-shadow:0 0 12px -2px var(--glow)}
.glass-c.on i{height:82%}
.moods{display:flex;gap:9px;flex-wrap:wrap}
.mood{font-size:28px;width:56px;height:56px;border-radius:18px;border:2px solid var(--line);background:var(--field);cursor:pointer;transition:.25s;display:grid;place-items:center}
.mood:hover{transform:scale(1.1) rotate(-5deg)}
.mood.on,input:checked+.mood{border-color:var(--p);background:color-mix(in srgb,var(--p) 18%,transparent);transform:scale(1.1);box-shadow:0 0 18px -2px var(--glow)}
.mlabel input{position:absolute;opacity:0;pointer-events:none}
.big{font-size:30px;font-weight:700}
.numin{width:120px;flex:0 0 auto}

/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:38px;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 40%),linear-gradient(180deg,var(--a1),var(--p));transition:height .8s;min-height:4px;box-shadow:0 0 14px -3px var(--glow)}
.bars .b span{font-size:11px;color:var(--muted);font-weight:700}
.bars .b em{font-size:11px;font-style:normal;font-weight:700}
.hbar{margin-bottom:12px}
.hbar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:600}
.donut{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;margin:auto;box-shadow:0 0 30px -8px var(--glow)}
.donut>div{width:118px;height:118px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;text-align:center;box-shadow:inset 0 2px 10px rgba(0,0,0,.08)}
.donut b{font-size:26px}

.mcard .v{font-size:26px;font-weight:700;margin-top:6px}
.inc{color:#059669}.exp{color:#e11d48}
html.dark .inc{color:#6ee7b7}html.dark .exp{color:#fda4af}

/* journal & notes */
.jentry{padding:14px 6px;border-bottom:1px dashed var(--line)}
.jentry:last-child{border:0}
.jentry .h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.jentry p{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.notes{columns:3 230px;column-gap:16px}
.note{break-inside:avoid;margin-bottom:16px;border-radius:20px;padding:18px;position:relative;color:#1f2547;border:1px solid rgba(255,255,255,.75);
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 50%),var(--nc);box-shadow:0 12px 26px -14px rgba(30,30,90,.35),0 0 20px -10px var(--nc);transition:.3s}
.note:hover{transform:translateY(-4px) rotate(.5deg)}
.note h4{font-size:15.5px;margin-bottom:6px;padding-right:26px}
.note p{font-size:13.5px;line-height:1.65;white-space:pre-wrap;font-weight:600}
.note .del{position:absolute;top:10px;right:8px;color:#4b5563}
.note small{display:block;margin-top:10px;font-size:11px;opacity:.6}

/* settings */
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:700}
.sw span{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.8);transition:.3s;position:relative}
.sw span::after{content:"";position:absolute;top:8px;left:12px;width:14px;height:9px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg)}
.sw:hover span{transform:scale(1.08)}
.sw.on span{transform:scale(1.12);box-shadow:0 0 0 3px var(--text),0 0 22px var(--glow)}
.toggle{width:52px;height:30px;border-radius:20px;background:color-mix(in srgb,var(--p) 25%,transparent);position:relative;cursor:pointer;border:1px solid var(--line);transition:.3s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on{background:var(--grad);box-shadow:0 0 14px -2px var(--glow)}.toggle.on::after{left:25px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border:0}
.faq{border-bottom:1px dashed var(--line);padding:14px 4px}
.faq:last-child{border:0}
.faq b{display:block;margin-bottom:5px}
.faq b::before{content:"✦ ";color:var(--a1)}
.faq p{font-size:13.5px;color:var(--muted);line-height:1.65;font-weight:600}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(200px);opacity:0;padding:12px 22px;border-radius:18px;font-size:14px;font-weight:700;transition:.45s cubic-bezier(.2,1.4,.4,1);z-index:1000;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%),var(--grad);box-shadow:0 12px 30px -8px var(--glow),0 0 30px -8px var(--glow2);border:1px solid rgba(255,255,255,.6)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.overlay{display:none}
.footer{text-align:center;font-size:11px;letter-spacing:.32em;color:var(--muted);padding:4px 0 6px;font-weight:700}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .app{padding:10px;gap:12px}
  .side{position:fixed;left:10px;top:10px;bottom:10px;height:auto;z-index:50;transform:translateX(-120%);transition:transform .4s cubic-bezier(.2,.8,.3,1)}
  .side.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(10,12,40,.35);z-index:40;backdrop-filter:blur(3px)}
  .menu-btn{display:grid}
  .top{top:10px}
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}
  .hero{flex-direction:column;padding:24px 22px 80px}
  .hero h2{font-size:32px}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-m{display:none!important}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.ql{grid-template-columns:repeat(3,1fr)}.stat .v{font-size:19px}.orb{width:40px;height:40px}.week{grid-template-columns:1fr}.page-head h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.side,.top .icon-btn,.top .btn,.magic,.addf,.del{display:none!important}.app{padding:0}body{background:#fff}.glass{backdrop-filter:none;box-shadow:none}}

/* ===== polish: flat icon tiles, no Ctrl K chip, green done / red pending ===== */
.orb{width:48px;height:48px;border-radius:15px;color:color-mix(in srgb,var(--c) 75%,#fff);
  background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:none}
.orb svg{width:22px;height:22px}
.lv{width:40px;height:40px;border-radius:13px;flex-direction:column;gap:0;line-height:1;font-size:16px;color:var(--p);
  background:color-mix(in srgb,var(--p) 18%,transparent);border:1px solid color-mix(in srgb,var(--p) 38%,transparent);box-shadow:none}
.lv::before{content:"LV";font-size:8px;letter-spacing:.12em;opacity:.75;margin-bottom:2px}
.searchbtn .kbd{display:none}
.bar{background:color-mix(in srgb,#f43f5e 18%,transparent)}
.bar i{background:linear-gradient(90deg,#34d399,#10b981);box-shadow:0 0 10px rgba(16,185,129,.45)}
.bar.danger i{background:linear-gradient(90deg,#fb7185,#e11d48);box-shadow:0 0 10px rgba(225,29,72,.4)}
.row:has(.chk){border-left:3px solid transparent;padding-left:8px}
.row:has(.chk):not(.done){background:color-mix(in srgb,#f43f5e 7%,transparent);border-left-color:color-mix(in srgb,#f43f5e 65%,transparent)}
.row.done:has(.chk){background:color-mix(in srgb,#10b981 9%,transparent);border-left-color:#10b981}
.row:has(.chk){margin-bottom:5px;border-bottom-color:transparent}
.chk{border-color:color-mix(in srgb,#f43f5e 55%,transparent)}
.chk:hover{border-color:#f43f5e;box-shadow:0 0 10px rgba(244,63,94,.35)}
.chk.on{background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%),#10b981;border-color:transparent;box-shadow:0 0 12px rgba(16,185,129,.5)}

/* cute icons */
.ico.emo{font-size:16px;line-height:1}
.qt .ico.emo{font-size:23px}
.nav .ico.emo{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav:hover .ico.emo,.qt:hover .ico.emo{transform:scale(1.15) rotate(-8deg)}
.stkr{width:54px;flex-shrink:0;display:block}
.stkr svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 5px 6px rgba(20,10,50,.28));transform:rotate(-6deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.card:nth-child(even) .stkr svg{transform:rotate(6deg)}
.card:hover .stkr svg{transform:rotate(0) scale(1.12)}
.stk-eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.lv.stk-lv{width:46px;height:46px;background:none;border:0;box-shadow:none;padding:0}
.lv.stk-lv::before{content:none}
.lv.stk-lv svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 5px rgba(20,10,50,.28));transform:rotate(-8deg)}
@media (max-width:520px){.stkr{width:44px}}

/* ===== video background (put bg.mp4 next to this html) ===== */
.bgv{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;background:#000;overflow:hidden}
.bgv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:translateZ(0);backface-visibility:hidden}
.bgv-tint{position:absolute;inset:0;background:rgba(255,255,255,.06)}
html.dark .bgv-tint{background:rgba(8,10,35,.22)}
html.has-video .bgv{opacity:1}
html.has-video .magic{display:none}
html.has-video body{background:#000}
</style>

/* ---------- Dreamy smooth scroll ---------- */
function Smooth(getEl){
 const isWin=!getEl,st={cur:0,tgt:0,raf:0};
 const el=()=>getEl?getEl():document.scrollingElement;
 const max=()=>isWin?document.documentElement.scrollHeight-innerHeight:el().scrollHeight-el().clientHeight;
 const get=()=>isWin?scrollY:el().scrollTop;
 const set=v=>{if(isWin)window.scrollTo(0,v);else el().scrollTop=v};

 const go=v=>{if(!st.raf)st.cur=st.tgt=get();st.tgt=Math.max(0,Math.min(max(),v(st.tgt)));if(!st.raf)st.raf=requestAnimationFrame(loop)};

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.sfx);o.start(t);o.stop(t+dur+.05)}

function lofiBuild(){const c=ac();if(!c)return false;if(LOFI.nodes)return true;

 const an=c.createAnalyser();an.fftSize=64;an.smoothingTimeConstant=.8;an.connect(out);

 const bassF=c.createBiquadFilter();bassF.type='lowpass';bassF.frequency.value=320;bassF.connect(bus);
 const drums=c.createGain();drums.gain.value=.55;drums.connect(bus);

 const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;

 const rainF=c.createBiquadFilter();rainF.type='lowpass';rainF.frequency.value=1400;const rainH=c.createBiquadFilter();rainH.type='highpass';rainH.frequency.value=250;
 const rainG=c.createGain();rainG.gain.value=0;rainF.connect(rainH);rainH.connect(rainG);rainG.connect(an);

function lKeys(f,t,dur,v){const c=AC.ctx,N=LOFI.nodes,g=c.createGain();env(g,t,.015,v,.5,.45,dur);g.connect(N.keysF);
 [[0,'triangle',.5],[-8,'sine',.5],[8,'sine',.5],[1200,'sine',.12]].forEach(([d,ty,lv])=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=f;o.detune.value=d;N.wobG.connect(o.detune);og.gain.value=lv;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.05)})}

function lSnare(t){lNoise(t,'bandpass',1700,.2,.2);const c=AC.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.08);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(LOFI.nodes.drums);o.start(t);o.stop(t+.14)}
const lHat=(t,v)=>lNoise(t,'highpass',7500,v,.045);
function lBell(f,t,dur,v){const c=AC.ctx,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain();o.frequency.value=f;o2.frequency.value=f*2.01;g2.gain.value=.25;env(g,t,.01,v,.3,.3,dur+.6);o.connect(g);o2.connect(g2);g2.connect(g);g.connect(LOFI.nodes.keysF);o.start(t);o2.start(t);o.stop(t+dur+.7);o2.stop(t+dur+.7)}
function lofiStep(s,t){const M=MOODS[S.mood],spb=60/M.bpm,six=spb/4,ch=M.ch[LOFI.bar%M.ch.length];t+=(s%2)?six*.22:0;
 if(s===0){ch.forEach((m,i)=>lKeys(midiF(m),t+i*.014,spb*3.6,.05));lBass(midiF(ch[0]-12),t,spb*1.6,.3)}
 if(s===8&&Math.random()<.7)ch.forEach((m,i)=>lKeys(midiF(m),t+i*.01,spb*1.8,.032));
 if(s===10)lBass(midiF(ch[0]-12),t,spb*.8,.24);
 if(s===14&&Math.random()<.5)lBass(midiF(ch[2]-12),t,spb*.45,.18);
 if(s===0||s===10||(s===7&&Math.random()<.35))lKick(t);
