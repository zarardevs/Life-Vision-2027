const _ins=V.insights;V.insights=()=>{const t=td(),W=20,start=weekStart(addDays(t,-7*(W-1)));let act='',md='';
 for(let w=0;w<W;w++)for(let d=0;d<7;d++){const day=addDays(start,w*7+d);if(day>t){act+='<i class="hx fut"></i>';md+='<i class="hx fut"></i>';continue}
  const n=S.tasks.filter(x=>x.doneAt===day).length+S.habits.filter(h=>h.log[day]).length+S.journal.filter(j=>j.date===day).length,lv=Math.min(100,28+n*14);
  act+=`<i class="hx" title="${fmtDate(day)} · ${n} activit${n===1?'y':'ies'}" style="${n?`background:color-mix(in srgb,var(--p) ${lv}%,transparent);${n>=4?'box-shadow:0 0 8px var(--glow)':''}`:''}"></i>`;
  const m=(S.health[day]||{}).mood||(S.journal.find(j=>j.date===day)||{}).mood;md+=`<i class="hx" title="${fmtDate(day)}${m?' · '+m:''}" style="${m&&MOODC[m]?`background:${MOODC[m]};box-shadow:0 0 6px ${MOODC[m]}88`:''}"></i>`}
 return _ins()+`<div class="grid g2" style="margin-top:18px"><div class="card glass"><h3>✨ Activity — last 20 weeks</h3><div class="heat">${act}</div><div class="hlegend">Less ${[10,30,55,80,100].map(v=>`<i style="background:color-mix(in srgb,var(--p) ${v}%,transparent)"></i>`).join('')} More</div></div>
 <div class="card glass"><h3>🌈 Mood pixels</h3><div class="heat">${md}</div><div class="hlegend">${Object.entries(MOODC).map(([e,c])=>`<span><i style="background:${c}"></i>${e}</span>`).join('')}</div></div></div>`};

/* rewards page */
V.rewards=()=>{const l=lvl(S.xp),a=lvlXp(l),b=lvlXp(l+1),pc=Math.round((S.xp-a)/(b-a)*100),un=BADGES.filter(x=>S.badges[x[0]]).length;
 const kpi=(e,tn,lb,v)=>`<div class="card glass"><div class="stat"><span class="orb t${tn}">${e}</span><div><b>${lb}</b><div class="v">${v}</div></div></div></div>`;
 return head('Rewards & Badges','Earn XP for every bit of progress and level up your fairy tale!')+`<div class="card glass"><div class="lvhero"><div class="lvorb"><div><small>LEVEL</small><b>${l}</b></div></div>
 <div style="flex:1;min-width:220px"><div style="font-family:'Dancing Script',cursive;font-size:22px;color:var(--p)">You are a</div><div class="page-head" style="margin:0"><h2>${lvName(l)}</h2></div>
 <div class="sub">${S.xp} XP total · ${b-S.xp} XP to level ${l+1} — ${lvName(l+1)}</div><div class="bar" style="height:12px"><i style="width:${pc}%"></i></div></div></div></div>
 <div class="grid g4" style="margin-top:18px">${kpi(svg('tasks'),8,'Tasks completed',S.stats.tasks)}${kpi(svg('habits'),6,'Habit check-ins',S.stats.habits)}${kpi(svg('focus'),9,'Focus sessions',S.stats.pomos)}${kpi(svg('trophy'),3,'Badges',`${un}<small> / ${BADGES.length}</small>`)}</div>
 <div class="card glass" style="margin-top:18px"><h3>🏅 Badge Collection <span class="muted" style="font-weight:600;font-size:13px">${un} of ${BADGES.length} unlocked</span></h3><div class="badges">${BADGES.map(([id,e,n,d])=>{const on=S.badges[id];return `<div class="badge ${on?'on':'off'}"><span class="be">${on?e:'🔒'}</span><b>${n}</b><small>${d}</small>${on?`<small style="color:var(--p)">✓ ${fmtDate(on)}</small>`:''}</div>`}).join('')}</div></div>
 <div class="card glass" style="margin-top:18px"><h3>✨ How to earn XP</h3><div class="keys">${[['+10','Complete a task'],['+5','Check a habit, focus item, milestone or bill'],['+3','Tick a list item'],['+15','Write a journal entry (+5 for gratitude)'],['+20','Finish a focus session'],['+10','Drink all 8 glasses of water'],['+50','Achieve a goal']].map(([x,d])=>`<span class="tag t4">${x} XP</span><span>${d}</span>`).join('')}</div></div>`};

/* settings + help extras */
const KEYS=[['Ctrl K','Search anything / quick add'],['/','Quick search'],['N','New task'],['F','Focus timer'],['M','Play / pause lofi'],['D','Day / night'],['?','Show shortcuts'],['Esc','Close dialogs']];
const keysHTML=()=>`<div class="keys">${KEYS.map(([k,d])=>`<span class="kbd">${k}</span><span>${d}</span>`).join('')}</div>`;
const _set=V.settings;V.settings=()=>{const h=_set(),i=h.lastIndexOf('</div>'),granted=S.notify&&window.Notification&&Notification.permission==='granted';
 return h.slice(0,i)+`<div class="card glass"><h3>🔊 Sound & Music</h3>
 <div class="setrow"><div><b>Magic UI sounds</b><div class="sub">Soft clicks, chimes & sparkles</div></div><button class="toggle ${S.sound?'on':''}" data-act="sndT" aria-label="UI sounds"></button></div>
 <div class="setrow"><span>Effects volume</span><input type="range" min="0" max="1" step="0.05" value="${S.sfxVol}" data-inp="sfxv" data-chg="saveOnly" style="max-width:170px;margin:0" aria-label="Effects volume"></div>
 <div class="setrow"><span>Music volume</span><input type="range" min="0" max="1" step="0.01" value="${S.musicVol}" data-inp="musv" data-chg="saveOnly" style="max-width:170px;margin:0" aria-label="Music volume"></div>
 <div class="setrow"><div><b>Video background</b><div class="sub">Plays bg.mp4 from the same folder as this file</div></div><button class="toggle ${S.bgVideo!==false?'on':''}" data-act="bgvT" aria-label="Video background"></button></div>
  <div class="setrow"><div><b>Auto-play lofi on open</b><div class="sub">Music starts by itself when the app opens</div></div><button class="toggle ${S.autoMusic?'on':''}" data-act="amT" aria-label="Auto-play lofi"></button></div>
 <div class="setrow"><div><b>Lofi with focus timer</b><div class="sub">Music starts with a focus session</div></div><button class="toggle ${S.focusMusic?'on':''}" data-act="fmT" aria-label="Lofi with focus"></button></div>
 <button class="btn pri" data-act="player" style="margin-top:10px">${svg('music')}Open Lofi Radio</button></div>
 <div class="card glass"><h3>🔔 Reminders & Shortcuts</h3><div class="setrow"><div><b>Browser notifications</b><div class="sub">Reminders at a task's time while the app is open</div></div>${granted?'<span class="tag t5">✓ Enabled</span>':`<button class="btn gh sm" data-act="notif">${svg('bell')}Enable</button>`}</div>
 <div style="margin-top:12px">${keysHTML()}</div></div>`+h.slice(i)};
const _help=V.help;V.help=()=>_help()+`<div class="grid g2" style="margin-top:18px"><div class="card glass"><h3>✨ More magic</h3>${[
 ['How do I edit something?','Tap the text of any task, goal, habit, note, dream, bill or transaction. Deleted something by mistake? Press Undo on the message.'],
 ['How does the lofi radio work?','Tap the 🎵 button. Music is composed live in your browser — no internet, never repeats exactly. Pick a mood, add rain or vinyl crackle.'],
 ['What are XP and badges?','Every bit of progress earns XP. Level up from Dreamer to Celestial and collect 18 badges in Rewards.'],
 ['How do reminders work?','Edit a task and set a reminder time. When it is due today, you get a chime, a message and (if enabled) a browser notification.'],
 ['Can I move tasks around?','Yes — drag tasks between days in the Planner (week or month view).']
].map(([q,a])=>`<div class="faq"><b>${q}</b><p>${a}</p></div>`).join('')}</div><div class="card glass"><h3>⌨️ Keyboard shortcuts</h3>${keysHTML()}</div></div>`;
I.sfxv=el=>{S.sfxVol=+el.value;if(AC.sfx)AC.sfx.gain.value=S.sfxVol};
I.musv=el=>{S.musicVol=+el.value;setMix();document.querySelectorAll('[data-inp=musv]').forEach(x=>x!==el&&(x.value=el.value))};
C.saveOnly=()=>save();

/* ---- Command palette ---- */
let PSEL=0,PRES=[];const palEl=document.getElementById('pal'),palIn=palEl.querySelector('input');
function palItems(raw){const q=raw.toLowerCase().trim(),out=[];
 Object.entries(META).forEach(([k,m])=>out.push({ic:m.i,tn:m.t,t:m.l,s:'Go to section',run:()=>A.go(null,k)}));
 out.push({ic:'moon',tn:4,t:'Toggle day / night',s:'Theme',kw:'dark night light theme mode',run:()=>A.dark()},{ic:'music',tn:2,t:LOFI.on?'Pause lofi music':'Play lofi music',s:'Lofi radio',kw:'music lofi play pause radio',run:()=>lofiToggle()},{ic:'focus',tn:9,t:'Start a focus session',s:'Pomodoro',kw:'pomodoro timer focus start',run:()=>{A.go(null,'focus');if(!TM.run)A.tmToggle()}},{ic:'plus',tn:1,t:'New countdown',s:'Dashboard',kw:'countdown event',run:()=>A.addCd()});
 S.tasks.forEach(x=>out.push({ic:'tasks',tn:8,t:x.t,s:'Task · '+(x.done?'✓ done':x.due?fmtDate(x.due):'no date'),run:()=>A.eTask(null,x.id)}));
 S.goals.forEach(g=>out.push({ic:'flag',tn:4,t:g.t,s:'Goal · '+g.prog+'%',run:()=>{A.go(null,'goals');A.eGoal(null,g.id)}}));
 S.notes.forEach(n=>out.push({ic:'notes',tn:4,t:n.t,s:'Note · '+n.b.slice(0,50),kw:n.t+' '+n.b,run:()=>{A.go(null,'notes');A.eNote(null,n.id)}}));
 S.journal.forEach(j=>out.push({ic:'journal',tn:2,t:j.text.slice(0,60),s:'Journal · '+fmtDate(j.date),kw:j.text,run:()=>{A.go(null,'journal');A.eJournal(null,j.id)}}));
 Object.entries(S.lists).forEach(([k,L])=>L.forEach(x=>out.push({ic:META[k].i,tn:META[k].t,t:x.t,s:META[k].l,run:()=>{A.go(null,k);A.eLi(null,x.id)}})));
 S.habits.forEach(h=>out.push({ic:'habits',tn:6,t:h.e+' '+h.t,s:'Habit',run:()=>A.go(null,'habits')}));
 let res=q?out.filter(o=>(o.kw||o.t).toLowerCase().includes(q)||o.t.toLowerCase().includes(q)):out.slice(0,9);
 if(q)res.unshift({ic:'plus',tn:5,t:`Add task: “${raw.trim()}”`,s:'Quick add for today · press Enter',run:()=>{S.tasks.push({id:uid(),t:raw.trim(),due:td(),pri:'med',cat:'Personal',done:false});R();sfx('add');toast('➕ Task added for today')}});
 return res.slice(0,14)}
function drawPal(){document.getElementById('plist').innerHTML=PRES.map((o,i)=>`<div class="pitem ${i===PSEL?'on':''}" data-pi="${i}"><span class="ico t${o.tn||1}">${svg(o.ic)}</span><div style="min-width:0;flex:1"><b>${esc(o.t)}</b><small>${esc(o.s||'')}</small></div>${i===PSEL?'<span class="kbd">↵</span>':''}</div>`).join('')||'<div class="empty"><div>🔮</div>No magic found</div>'}
function openPal(){palEl.classList.add('show');palIn.value='';PRES=palItems('');PSEL=0;drawPal();sfx('open');palIn.focus();[30,90,200].forEach(ms=>setTimeout(()=>{if(palEl.classList.contains('show')&&document.activeElement!==palIn)palIn.focus()},ms))}
const closePal=()=>palEl.classList.remove('show');
function runPal(i){const o=PRES[i];if(!o)return;closePal();o.run()}
palIn.addEventListener('input',()=>{PRES=palItems(palIn.value);PSEL=0;drawPal()});
palIn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();PSEL=Math.max(0,Math.min(PRES.length-1,PSEL+(e.key==='ArrowDown'?1:-1)));drawPal();const on=palEl.querySelector('.pitem.on');on&&on.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();runPal(PSEL)}});
document.getElementById('plist').addEventListener('click',e=>{const it=e.target.closest('[data-pi]');if(it)runPal(+it.dataset.pi)});
document.getElementById('plist').addEventListener('mousemove',e=>{const it=e.target.closest('[data-pi]');if(it&&+it.dataset.pi!==PSEL){PSEL=+it.dataset.pi;drawPal()}});
palEl.addEventListener('click',e=>{if(e.target===palEl)closePal()});

/* ---- Keyboard shortcuts ---- */
const showKeys=()=>openModal({title:'⌨️ Shortcuts',extra:keysHTML(),saveLabel:'Got it ✨',noCancel:1});
document.addEventListener('keydown',e=>{const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palEl.classList.contains('show')?closePal():openPal();return}
 if(e.key==='Escape'){closeModal();closePal();document.getElementById('player').classList.remove('open');return}
 if(palEl.classList.contains('show')){if(!typing)palIn.focus();return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey||document.getElementById('modal').classList.contains('show'))return;
 const k=e.key.toLowerCase();
 if(k==='/'){e.preventDefault();openPal()}else if(k==='n'){A.go(null,'tasks');focusSel('form[data-form=task] input[name=t]')}else if(k==='d')A.dark();else if(k==='m'){lofiToggle()}else if(k==='f')A.go(null,'focus');else if(e.key==='?')showKeys()});

/* ---- Reminders ---- */
function checkReminders(){const t=td(),n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');let ch=false;
 S.tasks.forEach(x=>{if(!x.done&&x.time&&x.due===t&&!x.reminded&&x.time<=hm){x.reminded=true;ch=true;sfx('chime');toast('⏰ Reminder: '+x.t);
  if(S.notify&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('⏰ Life Vision 2027',{body:x.t})}catch(e){}}}});if(ch){save();if(view==='tasks'||view==='dashboard')render()}}
setInterval(checkReminders,20000);

/* ---- Onboarding (first visit) ---- */
const MASCOT=`<div class="mascot" aria-hidden="true"><svg viewBox="0 0 170 132">
 <defs><linearGradient id="mbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--p) 30%,white)"/></linearGradient></defs>
 <g class="m-bub"><rect x="2" y="8" width="50" height="30" rx="15" fill="#fff" style="stroke:var(--p)" stroke-width="2"/><polygon points="40,36 52,46 46,34" fill="#fff" style="stroke:var(--p)" stroke-width="2" stroke-linejoin="round"/><rect x="38" y="31" width="10" height="5" fill="#fff"/>
  <text x="27" y="29" text-anchor="middle" font-family="Dancing Script,cursive" font-size="19" font-weight="700" style="fill:var(--pd)">Hi!</text></g>
 <text class="twk" x="84" y="14" font-size="14" fill="#fbbf24" style="filter:drop-shadow(0 0 4px #fde68a)">✦</text>
 <text class="twk" x="150" y="34" font-size="10" fill="#fff" style="animation-delay:-1s">✦</text><text class="twk" x="20" y="112" font-size="9" fill="#fff" style="animation-delay:-2s">✧</text>
 <g style="stroke:color-mix(in srgb,var(--p) 45%,white)" stroke-width="2.5" fill="url(#mbody)">
  <path d="M46 94 Q36 100 34 110" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M46 94 Q36 100 34 110" stroke-width="11" stroke-linecap="round" fill="none" style="stroke:color-mix(in srgb,var(--p) 18%,white)"/>
  <g class="m-arm"><path d="M118 88 Q134 80 140 62" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M118 88 Q134 80 140 62" stroke-width="11" stroke-linecap="round" fill="none" style="stroke:#fff"/><circle cx="141" cy="58" r="8.5" fill="#fff"/>
   <g class="m-lines" fill="none" stroke-width="2" stroke-linecap="round" style="stroke:var(--p)"><path d="M153 46 q4 6 0 12"/><path d="M158 42 q6 9 0 18"/></g></g>
  <path d="M42 102 C22 102 22 72 44 72 C42 50 66 38 82 50 C92 34 122 40 120 64 C140 64 142 100 120 102 Z"/>
 </g>
 <ellipse class="m-eye" cx="70" cy="78" rx="5.5" ry="7.5" fill="#1e2a4a"/><ellipse class="m-eye" cx="96" cy="78" rx="5.5" ry="7.5" fill="#1e2a4a" style="animation-delay:.05s"/>
 <circle cx="72" cy="75" r="2" fill="#fff"/><circle cx="98" cy="75" r="2" fill="#fff"/>
 <ellipse cx="59" cy="90" rx="7" ry="4" fill="#f9a8d4" opacity=".75"/><ellipse cx="107" cy="90" rx="7" ry="4" fill="#f9a8d4" opacity=".75"/>
 <path d="M76 89 Q83 98 90 89 Z" fill="#fb7185" stroke="#1e2a4a" stroke-width="2" stroke-linejoin="round"/>
</svg></div>`;
/* after the splash: always ask/confirm the name; any tap or key in it also starts the lofi music */
window.afterSplash=()=>{const back=!!S.name;if(!S.onboarded){S.onboarded=true;save()}
 openModal({title:back?'Welcome back, '+esc(S.name)+'!':'Hi, dreamer!',top:MASCOT,fields:[{name:'name',label:'What should we call you?',ph:'Your name',value:S.name||'',req:1},{name:'theme',label:'Pick your magic',type:'select',value:S.theme,options:THEMES.map(x=>[x[0],x[1]])}],
  extra:`<div class="sub" style="margin:-2px 0 4px;line-height:1.6">Your planner lives privately in this browser. Tip: press <span class="kbd">Ctrl K</span> to search anything and tap 🎵 for endless lofi music.</div>`,saveLabel:back?'Let\'s go ✨':'Begin my story ✨',
  onSave:d=>{const first=!S.name;S.name=d.name.trim();S.theme=d.theme;if(first)addXP(20);R();sfx('level');burst(innerWidth/2,innerHeight/2);
   if(S.autoMusic&&!LOFI.on)lofiStart();
   toast((first?'🏰 Welcome to your fairy tale, ':'💖 Welcome back, ')+S.name+'!')}})};

checkBadges(true);
render();onScroll();

/* video background: plays bg.mp4 (or background.mp4 / bg.webm) from the html's folder, full screen, auto-fit */
(function(){const w=document.getElementById('bgv');if(!w)return;const v=w.querySelector('video'),H=document.documentElement;
 const on=()=>S.bgVideo!==false;
 const play=()=>{if(!on())return;const p=v.play();p&&p.catch(()=>{})};
 v.addEventListener('playing',()=>{if(on())H.classList.add('has-video')});
 document.addEventListener('visibilitychange',()=>{document.hidden?v.pause():play()});
 ['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(on()&&v.paused&&v.readyState>1)play()},{capture:true,passive:true}));
 window.bgvApply=()=>{if(on()){play();if(!v.paused)H.classList.add('has-video')}else{v.pause();H.classList.remove('has-video')}};
 A.bgvT=()=>{S.bgVideo=!on();R();bgvApply();toast(on()?'🎬 Video background on':'🌌 Classic background')};
 if(!on())v.pause();else play()})();
/* splash: plays on every load, then the app opens by itself */
(function(){const sp=document.getElementById('splash');if(!sp)return;
 const hide=()=>{sp.classList.add('hide');try{if(S.autoMusic&&!LOFI.on){const c=ac();if(c){const go=()=>{if(c.state==='running'&&!LOFI.on)lofiStart()};go();c.resume&&c.resume().then(go).catch(()=>{})}}}catch(e){}burst(innerWidth/2,innerHeight/2);setTimeout(reveal,150);setTimeout(()=>sp.remove(),1000);setTimeout(()=>window.afterSplash&&afterSplash(),900)};
 setTimeout(hide,reduce?900:4200)})();
</script>
</body>
</html>
